server {
  listen 80;
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The frontend currently calls API paths at the origin root (e.g. /auth/login,
  # /products, /sales). Proxy those paths without requiring a frontend /api prefix.
  location ~ ^/(auth|products|categories|inventory|sales|reports|sync|branches|stock-transfers|suppliers|delivery|chatbot|scanner|enterprise|drug-knowledge|alerts|audit|data-migrations|saas|performance|users|customers|purchases|expenses|returns|shifts|notifications|activity|settings|heldSales)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }
}
