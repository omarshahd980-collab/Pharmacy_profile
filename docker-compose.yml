services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql+psycopg://pharmacy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/pharmacy
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?BOOTSTRAP_PASSWORD must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
